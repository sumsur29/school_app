.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.row h4{margin:0;font-family:var(--disp);font-weight:500;font-size:17.5px;letter-spacing:-.01em;line-height:1.3}

.row.done h4{text-decoration:line-through;opacity:.38}

.claim{width:27px;height:27px;border:1.5px solid rgba(7,26,18,.26);border-radius:50%;flex-shrink:0;margin-top:3px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10.5px;color:transparent}

.grouprow{display:flex;gap:13px;align-items:center;padding:13px 0;border-bottom:1px solid var(--pline);width:100%}

.blk{padding:22px}

.drow:last-child{border-bottom:none}

.btn{display:block;width:100%;text-align:center;padding:14px;font-family:var(--body);font-size:14.5px;font-weight:500;letter-spacing:0;background:var(--ink);color:var(--chalk);margin-top:11px}

.btn.dghost{background:none;color:var(--chalk);box-shadow:inset 0 0 0 1px var(--line)}
.btn.busy{opacity:.5}

.nav{position:fixed;bottom:0;left:0;right:0;background:var(--ink);border-top:1px solid var(--line);display:flex;max-width:460px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom);z-index:10}
.nav{background:#061710}
.nav button{flex:1;padding:17px 4px 19px;font-family:var(--body);font-size:14px;font-weight:500;letter-spacing:0;color:rgba(233,237,231,.5);position:relative;text-align:center;transition:color .15s}
.nav button.on{color:var(--chalk)}
.nav button.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:30px;height:3px;background:var(--red)}

.seg{display:flex;margin-top:14px}

.seg button.on{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
.filt{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}

.filt button.on{background:var(--chalk);color:var(--ink);box-shadow:none}
.mrow{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;gap:12px}
.mrow:last-child{border-bottom:none}
.mrow span:last-child{font-family:var(--mono);font-size:13px;color:var(--sage);text-align:right}
.sync{font-family:var(--body);font-size:12.5px;color:var(--sage);display:flex;align-items:center;gap:6px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--sage)}
.sync.off i{background:var(--red)}
.back{font-family:var(--body);font-size:13.5px;font-weight:500;color:var(--sage);display:inline-block;margin-bottom:14px}
.note{font-size:13px;color:var(--sage);line-height:1.5;margin-top:12px}

:focus-visible{outline:2px solid var(--red);outline-offset:2px}

let L=(FAM&&disk.get('runway:'+FAM))||{};
let pending=new Set();
let online=true, view='runway', busy='', flash='', filter='all', openSrc='', openHelp='';

const saveLocal=()=>{if(FAM)disk.set('runway:'+FAM,L)};
const get=(k,d)=>L[k]||d;

const members=()=>Object.keys(L).filter(k=>k.indexOf('member:')===0)
  .map(k=>({id:k.slice(7),name:(L[k]&&L[k].name)||'?'})).sort((a,b)=>a.name.localeCompare(b.name));
const nameOf=id=>{const m=L['member:'+id];return (m&&m.name)||'someone'};
const initialOf=id=>{const n=nameOf(id);return n.trim().charAt(0).toUpperCase()||'?'};
const tintOf=id=>{let s=0;for(let i=0;i<String(id).length;i++)s+=String(id).charCodeAt(i);return s%2?'z':''};
const others=()=>members().filter(m=>m.id!==ME);

function write(k,v){
  L[k]=Object.assign({},v,{at:Date.now(),who:ME});
  saveLocal();pending.add(k);render();queuePush();
}
function mergeIn(remote){
  let touched=false;
  for(const k in (remote||{})){
    const v=remote[k];
    if(!v||typeof v!=='object')continue;
    if(!L[k]||(Number(v.at)||0)>(Number(L[k].at)||0)){L[k]=v;touched=true}
  }
  if(touched)saveLocal();
  return touched;
}
let pushTimer=null;
const queuePush=()=>{clearTimeout(pushTimer);pushTimer=setTimeout(push,600)};

async function push(){
  if(!FAM||!pending.size)return;
  const body={};pending.forEach(k=>{if(L[k])body[k]=L[k]});
  try{
    const r=await fetch('/api/state?f='+encodeURIComponent(FAM),
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok)throw new Error('bad');
    const server=await r.json();
    pending.clear();online=true;
    if(mergeIn(server))render();else paintSync();
  }catch(e){online=false;paintSync()}
}
async function pull(){
  if(!FAM)return;
  try{
    const r=await fetch('/api/state?f='+encodeURIComponent(FAM),{cache:'no-store'});
    if(!r.ok)throw new Error('bad');
    online=true;
    if(mergeIn(await r.json()))render();else paintSync();
  }catch(e){online=false;paintSync()}
}

const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const D=s=>new Date(s+'T00:00:00');
const days=(a,b)=>Math.round((b-a)/864e5);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt=d=>d.getDate()+' '+MON[d.getMonth()];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const val=x=>typeof x==='function'?x():x;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);
  return m<1?'just now':m<60?m+'m ago':m<1440?Math.round(m/60)+'h ago':Math.round(m/1440)+'d ago'};

const isHidden=id=>{const h=get('hide:'+id);return !!(h&&h.v)};
const customFacts=()=>Object.keys(L).filter(k=>k.indexOf('cf:')===0)
  .map(k=>Object.assign({},L[k],{id:k.slice(3),custom:true})).filter(f=>!f.deleted&&f.title);
const items=()=>SEED.filter(f=>!isHidden(f.id)).concat(customFacts());
const stateOf=id=>get('fact:'+id,{status:'open'});

const dated=()=>items().filter(f=>f.due).sort((a,b)=>D(a.due)-D(b.due));
const ahead=()=>dated().filter(f=>D(f.due)>=today());
const loose=()=>items().filter(f=>!f.due&&!f.group);
const paperwork=()=>items().filter(f=>f.group==='paperwork');
const anchorFact=()=>ahead().find(f=>f.anchor)||ahead()[0];
const nextBlocking=()=>ahead().find(f=>f.blocking&&stateOf(f.id).status!=='done');

const sourcesAdded=()=>Object.keys(L).filter(k=>k.indexOf('src:')===0)
  .map(k=>Object.assign({},L[k],{id:k.slice(4),added:true})).filter(s=>!s.deleted);
const allSources=()=>SOURCES.concat(sourcesAdded());
const fromSource=sid=>items().filter(f=>f.src===sid);
const stagedFor=sid=>Object.keys(L).filter(k=>k.indexOf('st:')===0)
  .map(k=>Object.assign({},L[k],{sid:k.slice(3)}))
  .filter(s=>!s.settled&&s.title&&(s.srcId===sid));
const stagedAll=()=>Object.keys(L).filter(k=>k.indexOf('st:')===0)
  .map(k=>Object.assign({},L[k],{sid:k.slice(3)})).filter(s=>!s.settled&&s.title);
const clashOpen=()=>!get('conf:'+CLASH.id);
const waiting=()=>stagedAll().length+(clashOpen()?1:0);

function row(f){

  const extra=get('lnk:'+f.id);
  const links=(f.links||[]).concat(extra&&extra.u?[{t:extra.t||'your link',u:extra.u}]:[]);

    '<span class="d">'+(f.due?fmt(D(f.due)):'—')+'</span><div class="b">'+
    '<button class="tt" data-tog="'+esc(f.id)+'">'+
      '<h4>'+esc(f.title)+
        (f.contested?'<span class="flag hot">contested</span>':'')+
        (f.waiting?'<span class="flag">school</span>':'')+
        (f.custom?'<span class="flag">added</span>':'')+'</h4>'+

      links.map(l=>'<a href="'+esc(l.u)+'" target="_blank" rel="noopener">'+esc(l.t)+'</a>').join('')+

      '<button data-addlink="'+esc(f.id)+'">'+(extra&&extra.u?'edit link':'+ link')+'</button>'+
      '<button data-nix="'+esc(f.id)+'">not for us</button>'+

    ((openHelp===f.id&&f.term&&GLOSSARY[f.term])?'<p class="gloss">'+esc(GLOSSARY[f.term])+'</p>':'')+

    '<button class="claim" data-tog="'+esc(f.id)+'">'+(s.by?esc(initialOf(s.by)):'✓')+'</button></div>';

/* ---------- 1. now ---------- */
function runway(){
  const a=anchorFact();
  if(!a) return '<div class="blk" style="padding-top:60px"><h3>Nothing dated left.</h3>'+
    '<button class="btn dark" data-view="add">add something</button></div>';
  const n=days(today(),D(a.due)), u=nextBlocking();
  const cells=[];
  for(let i=0;i<=n;i++){
    const d=new Date(today().getTime()+i*864e5), k=iso(d);
    const on=dated().filter(f=>f.due===k);
    const hot=on.some(f=>f.blocking&&stateOf(f.id).status==='open');
    const held=on.some(f=>stateOf(f.id).status==='taken');
    const first=d.getDate()===1;
    const lab=first?MON[d.getMonth()].toLowerCase():((on.length||i===0)?d.getDate():'');
    cells.push('<div class="cell '+(hot?'hot':held?'held':on.length?'ev':'gone')+(i===0?' day0':'')+(first?' mth':'')+
      '" style="animation-delay:'+Math.min(i*12,760)+'ms">'+lab+'</div>');
  }

  const pw=paperwork(), pwIn=pw.filter(f=>stateOf(f.id).status==='done').length;
  const openLoose=loose().filter(f=>stateOf(f.id).status!=='done');
  const soon=ahead().filter(f=>f!==u).slice(0,5);
  const mine=items().filter(f=>stateOf(f.id).status==='taken'&&stateOf(f.id).by===ME).length;
  const theirs=others().map(m=>({m:m,c:items().filter(f=>stateOf(f.id).status==='taken'&&stateOf(f.id).by===m.id).length}));

  return '<div class="hero">'+
    '<div class="hbar"><span class="who"><span class="av '+tintOf(ME)+'">'+esc(initialOf(ME))+'</span>'+
    '<span style="font-size:13.5px;opacity:.72">'+YG+' · DIA Emirates Hills</span></span>'+
    '<span class="sync '+(online?'':'off')+'"><i></i>'+(online?'synced':'offline')+'</span></div>'+
    '<div class="count"><b>'+n+'</b>'+(a.contested?'<span class="ish">ish</span>':'')+'</div>'+
    '<div class="lede">sleeps until '+(a.anchor?'her first day':esc(String(a.title).toLowerCase()))+'</div>'+
    '<div class="sub">'+(a.contested?'Two calendars disagree - 31 Aug or 1 Sep.':fmt(D(a.due)))+'</div>'+
    '<div class="reg">'+cells.join('')+'</div>'+
    '<div class="legend"><span><i style="background:var(--red)"></i>nobody has it</span>'+
    '<span><i style="background:var(--sage)"></i>claimed or coming</span>'+
    '<span><i style="box-shadow:inset 0 0 0 2px var(--chalk)"></i>today</span></div></div>'+

/* ---------- 2. all ---------- */
function all(){
  const f=filter;
  let list=items();
  if(f==='hidden'){
    const back=SEED.filter(x=>isHidden(x.id));
    return '<div class="blk"><div class="phead"><span class="eyebrow">everything</span>'+
      '<button class="plus" data-view="add">+ add</button></div>'+
      '<h3 style="margin-top:14px">Put aside</h3>'+
      '<div class="filt">'+[['all','all'],['open','unclaimed'],['mine','mine'],['paperwork','paperwork'],['done','done'],['hidden','put aside']]
        .map(x=>'<button data-f="'+x[0]+'" class="'+(f===x[0]?'on':'')+'">'+x[1]+'</button>').join('')+'</div></div>'+
      '<div class="paper">'+(back.length?back.map(x=>'<div class="row"><span class="d">'+
        (x.due?fmt(D(x.due)):'—')+'</span><div class="b"><h4 style="opacity:.55">'+esc(x.title)+'</h4>'+
        '<div class="links"><button data-unnix="'+esc(x.id)+'">bring it back</button></div></div></div>').join('')
        :'<p style="opacity:.5;font-size:14px">Nothing put aside.</p>')+'</div>';
  }
  if(f==='paperwork')list=paperwork();
  else if(f==='mine')list=list.filter(x=>stateOf(x.id).by===ME&&stateOf(x.id).status!=='done');
  else if(f==='open')list=list.filter(x=>stateOf(x.id).status==='open');
  else if(f==='done')list=list.filter(x=>stateOf(x.id).status==='done');
  if(f!=='done')list=list.filter(x=>!x.due||D(x.due)>=today()||stateOf(x.id).status!=='done');

  const nodate=list.filter(x=>!x.due);
  const withdate=list.filter(x=>x.due).sort((a,b)=>D(a.due)-D(b.due));
  const by={};withdate.forEach(x=>{const d=D(x.due),k=MON[d.getMonth()]+' '+d.getFullYear();if(!by[k])by[k]=[];by[k].push(x)});

  return '<div class="blk"><div class="phead"><span class="eyebrow">everything</span>'+
    '<button class="plus" data-view="add">+ add</button></div>'+
    '<h3 style="margin-top:14px">'+YG+' · 2026-27</h3>'+
    '<div class="filt">'+[['all','all'],['open','unclaimed'],['mine','mine'],['paperwork','paperwork'],['done','done'],['hidden','put aside']]
      .map(x=>'<button data-f="'+x[0]+'" class="'+(f===x[0]?'on':'')+'">'+x[1]+'</button>').join('')+'</div></div>'+
    '<div class="paper">'+
    (nodate.length?'<div class="eyebrow">no date</div>'+nodate.map(row).join(''):'')+
    Object.keys(by).map(m=>'<div class="eyebrow" style="margin:20px 0 2px">'+m.toLowerCase()+'</div>'+
      by[m].map(row).join('')).join('')+
    (!nodate.length&&!withdate.length?'<p style="opacity:.5;font-size:14px">Nothing here.</p>':'')+
    '</div>';
}

    '<button class="btn dark '+(busy?'busy':'')+'" data-read="1">'+(busy?'reading…':'read it')+'</button>'+
    (flash?'<p class="note">'+esc(flash)+'</p>':'')+'</div>'+

    allSources().map(function(s){
      const fs=fromSource(s.id), st=stagedFor(s.id), isOpen=openSrc===s.id;

        ((s.links&&s.links.length)?'<div class="links dk">'+s.links.map(l=>'<a href="'+esc(l.u)+'" target="_blank" rel="noopener">'+esc(l.t)+'</a>').join('')+'</div>':'')+
        '<button class="fold" data-open="'+esc(isOpen?'':s.id)+'">'+(isOpen?'hide detail':'what it gave us')+'</button>'+
        (isOpen?(fs.length?'<div class="derived">'+fs.map(x=>'<div><span class="dt">'+
            (x.due?fmt(D(x.due)):'no date')+'</span>'+esc(x.title)+'</div>').join('')+'</div>':'')+
          ((s.also&&s.also.length)?'<div class="alsolist">'+s.also.map(a=>'<div>'+esc(a)+'</div>').join('')+'</div>':'')+
          (s.added?'<button class="btn dghost" data-delsrc="'+esc(s.id)+'">remove this document</button>':''):'')+

        ((st.length||clash)?'<div class="pend"><div class="k">waiting on you</div>'+
          (clash?'<div class="stg"><h5>'+esc(clash.field)+'</h5>'+
            '<button class="opt '+(pick==='a'?'pick':'')+'" data-pick="a"><span class="v">'+esc(clash.a.v)+'</span><span class="s2">'+esc(clash.a.src)+'</span></button>'+
            '<button class="opt '+(pick==='b'?'pick':'')+'" data-pick="b"><span class="v">'+esc(clash.b.v)+'</span><span class="s2">'+esc(clash.b.src)+'</span></button>'+
            '<p style="font-size:13px;opacity:.65;margin-top:10px;line-height:1.5">'+esc(clash.why)+'</p>'+
            '<span class="mini"><button class="yes" data-resolve="'+clash.id+'">keep my pick</button>'+
            '<button data-mail="1">ask the office</button></span></div>':'')+
          st.map(x=>'<div class="stg"><h5>'+esc(x.title)+'</h5>'+
            '<p>'+esc(x.due||'no date')+(x.blocking?' · blocking':'')+(x.note?' — '+esc(x.note):'')+'</p>'+
            '<span class="mini"><button class="yes" data-accept="'+esc(x.sid)+'">keep</button>'+
            '<button data-reject="'+esc(x.sid)+'">discard</button></span></div>').join('')+
        '</div>':'')+
      '</div>';
    }).join('');
}

/* ---------- render ---------- */
const VIEWS={runway:runway,all:all,papers:papers,info:info,add:addview};
const TABS=[['runway','now'],['all','all'],['papers','papers'],['info','info']];

function paintSync(){
  const el=document.querySelector('.sync');
  if(el){el.className='sync '+(online?'':'off');el.innerHTML='<i></i>'+(online?'synced':'offline')}
}
function render(){
  YG=get('yg',{v:'KG1'}).v;
  const app=document.getElementById('app'), nav=document.getElementById('nav');
  if(!FAM||!ME){app.innerHTML=setup();nav.style.display='none';return}
  nav.style.display='flex';
  app.innerHTML=(VIEWS[view]||runway)();
  const w=waiting();
  nav.innerHTML=TABS.map(t=>'<button data-view="'+t[0]+'" class="'+(view===t[0]?'on':'')+'">'+t[1]+
    ((t[0]==='papers'&&w)?'<span class="dot"></span>':'')+'</button>').join('');
  requestAnimationFrame(()=>{document.querySelectorAll('.cell').forEach(c=>c.classList.add('in'))});
}

function b64(file){
  return new Promise((res,rej)=>{const r=new FileReader();
    r.onload=()=>res(String(r.result).split(',')[1]);
    r.onerror=()=>rej(new Error('could not read that file'));
    r.readAsDataURL(file)});
}
async function readSource(){
  const ta=document.getElementById('paste'), fi=document.getElementById('pdf');
  const text=(ta&&ta.value||'').trim(), file=fi&&fi.files&&fi.files[0];
  if(!text&&!file){flash='Paste something or pick a PDF first.';render();return}
  if(file&&file.size>4000000){
    flash='That PDF is '+Math.round(file.size/1e6)+'MB and the limit is about 4MB. Split it, or paste the pages that matter.';
    render();return}
  busy='1';flash='';render();
  try{
    const payload={existing:items().map(f=>({id:f.id,title:f.title,due:f.due||null}))};
    if(file){payload.pdf=await b64(file);payload.filename=file.name}else payload.text=text;
    const r=await fetch('/api/extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const data=await r.json();
    if(!r.ok){flash=data.error?('Could not read it: '+data.error):'Could not read it.';busy='';render();return}
    const sid=newId('d');
    L['src:'+sid]={title:data.title,summary:data.summary,also:data.also||[],
      kind:'added by '+nameOf(ME),at:Date.now(),who:ME};
    pending.add('src:'+sid);
    (data.proposals||[]).forEach(p=>{const k='st:'+newId('s');
      L[k]=Object.assign({},p,{srcId:sid,at:Date.now(),who:ME});pending.add(k)});
    saveLocal();
    const n=(data.proposals||[]).length;
    flash=n?(n+' found — scroll down to '+data.title+' and keep the ones you want.'):'Read it. Nothing worth adding.';
    openSrc=sid;busy='';render();queuePush();
  }catch(e){flash='That did not go through. '+String(e.message||e);busy='';render()}
}

document.addEventListener('click',async function(e){
  const t=e.target.closest('[data-view],[data-tog],[data-pick],[data-resolve],[data-yg],[data-mail],[data-mkfam],[data-join],[data-be],[data-addme],[data-share],[data-switch],[data-save],[data-del],[data-hide],[data-read],[data-accept],[data-reject],[data-delsrc],[data-open],[data-f],[data-addlink],[data-help],[data-nix],[data-unnix]');
  if(!t)return;
  const d=t.dataset;

  if(d.mkfam){FAM=newFam();disk.set('fam',FAM);L={};saveLocal();render();return}
  if(d.join){
    const el=document.getElementById('joinid'), raw=el?el.value:'';
    const m=raw.match(/[?&]f=([a-z0-9-]+)/i);
    const code=(m?m[1]:raw).trim().replace(/[^a-z0-9-]/gi,'').slice(0,40);
    if(!code)return;
    FAM=code;disk.set('fam',FAM);L=disk.get('runway:'+FAM)||{};render();pull();return}
  if(d.be){ME=d.be;disk.set('me',ME);render();pull();return}
  if(d.addme){
    const el=document.getElementById('myname'), nm=(el&&el.value||'').trim().slice(0,24);
    if(!nm){if(el)el.focus();return}
    ME=newMemberId();disk.set('me',ME);write('member:'+ME,{name:nm});return}
  if(d.switch){ME=null;disk.set('me',null);render();return}
  if(d.share){
    try{await navigator.clipboard.writeText(d.share);t.textContent='copied'}
    catch(err){t.textContent=d.share}
    setTimeout(render,1400);return}
  if(d.read){readSource();return}
  if(d.open!==undefined){openSrc=d.open;render();return}
  if(d.save){
    const ti=document.getElementById('ntitle'), du=document.getElementById('ndue'),
          no=document.getElementById('nnote'), bl=document.getElementById('nblock');
    const title=(ti&&ti.value||'').trim().slice(0,80), due=(du&&du.value||'').trim();
    if(!title){if(ti)ti.focus();return}
    write('cf:'+newId('c'),{title:title,due:/^\d{4}-\d{2}-\d{2}$/.test(due)?due:null,
      note:(no&&no.value||'').trim().slice(0,200)||null,blocking:!!(bl&&bl.checked),src:'added'});
    view='runway';render();return}
  if(d.addlink){
    const cur=get('lnk:'+d.addlink,{});
    const u=prompt('Paste the link for this one', cur.u||'https://');
    if(u===null)return;
    const clean=u.trim();
    if(!clean||clean==='https://'){write('lnk:'+d.addlink,{u:'',t:''});return}
    write('lnk:'+d.addlink,{u:clean,t:'your link'});return;
  }
  if(d.help!==undefined){openHelp=d.help;render();return}
  if(d.unnix){write('hide:'+d.unnix,{v:false});return}
  if(d.nix){
    const cf=L['cf:'+d.nix];
    if(cf){write('cf:'+d.nix,Object.assign({},cf,{deleted:true}))}
    else{write('hide:'+d.nix,{v:true})}
    return;
  }
  if(d.del){write('cf:'+d.del,{deleted:true});return}
  if(d.delsrc){write('src:'+d.delsrc,{deleted:true});return}
  if(d.hide){write('hide:'+d.hide,{v:!isHidden(d.hide)});return}
  if(d.accept){
    const s=L['st:'+d.accept];if(!s)return;
    write('cf:'+newId('c'),{title:s.title,due:s.due||null,note:s.note||null,
      blocking:!!s.blocking,waiting:!!s.waiting,src:s.srcId||'added'});
    write('st:'+d.accept,Object.assign({},s,{settled:true}));return}
  if(d.reject){const s=L['st:'+d.reject];if(!s)return;
    write('st:'+d.reject,Object.assign({},s,{settled:true}));return}
  if(d.f&&!d.view){filter=d.f;render();return}
  if(d.view){view=d.view;flash='';if(d.f)filter=d.f;render();return}
  if(d.tog){
    const s=stateOf(d.tog);
    const next=s.status==='open'?{status:'taken',by:ME}:s.status==='taken'?{status:'done',by:ME}:{status:'open',by:null};
    write('fact:'+d.tog,next);return}
  if(d.pick){write('pick',{v:d.pick});return}
  if(d.resolve){const p=get('pick',{}).v;if(!p)return;write('conf:'+d.resolve,{v:p});return}
  if(d.yg){write('yg',{v:d.yg});return}
  if(d.mail){location.href='mailto:pssecretary@diadubai.com?subject=KG1%20start%20date%202026-27&body=Hello%2C%0A%0AThe%20welcome%20pack%20calendar%20and%20the%20calendar%20outline%20give%20different%20first%20days%20for%20KG1%20-%201%20September%20versus%2031%20August.%20Could%20you%20confirm%20which%20is%20correct%3F%0A%0AThank%20you.';return}
});

document.addEventListener('visibilitychange',function(){if(!document.hidden){pull();push()}});
window.addEventListener('online',function(){online=true;pull();push()});
window.addEventListener('offline',function(){online=false;paintSync()});

render();
if(FAM&&ME)pull();
setInterval(function(){if(!document.hidden)pull()},90000);
</script>
