<style>
:root{
  --pine:#0E3B2A; --ink:#071A12; --chalk:#E9EDE7; --sage:#7FA08C;
  --red:#DC3B2B; --redink:#FFD9D4; --deep:#0A2A1E;
  --line:rgba(233,237,231,.16); --pline:rgba(7,26,18,.14);
  --disp:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Inter Tight',system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--chalk);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{max-width:460px;margin:0 auto;min-height:100vh;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left}
input{font:inherit;background:rgba(233,237,231,.08);border:1px solid var(--line);color:var(--chalk);padding:11px 13px;width:100%;border-radius:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;opacity:.55}

.hero{background:var(--pine);padding:20px 22px 26px;position:relative;overflow:hidden}
.hbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}
.who{display:flex;align-items:center;gap:7px}
.av{width:21px;height:21px;border-radius:50%;background:var(--sage);color:var(--pine);font-family:var(--mono);font-size:11px;display:flex;align-items:center;justify-content:center}
.av.z{background:var(--chalk)}
.count{display:flex;align-items:flex-start;gap:10px}
.count b{font-family:var(--disp);font-weight:800;font-size:104px;line-height:.76;letter-spacing:-.055em;font-variant-numeric:tabular-nums;display:block}
.ish{font-family:var(--mono);font-size:13px;color:var(--sage);border-bottom:1px dashed var(--sage);padding-bottom:2px;margin-top:8px}
.lede{font-family:var(--disp);font-weight:400;font-size:24px;line-height:1.15;letter-spacing:-.02em;margin-top:20px;max-width:15ch}
.sub{font-size:13.5px;color:var(--sage);margin-top:9px;line-height:1.45}

.reg{margin-top:26px;border-top:1px solid var(--line);border-left:1px solid var(--line);display:grid;grid-template-columns:repeat(9,1fr)}
.cell{aspect-ratio:1;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--sage);opacity:0}
.cell.in{animation:pop .3s ease-out forwards}
@keyframes pop{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:none}}
.cell.gone{color:rgba(127,160,140,.26)}
.cell.ev{background:var(--sage);color:var(--pine)}
.cell.hot{background:var(--red);color:#fff}
.cell.held{background:var(--sage);color:var(--pine);box-shadow:inset 0 0 0 2px var(--pine)}
.cell.day0{box-shadow:inset 0 0 0 2px var(--chalk)}
.legend{display:flex;gap:13px;margin-top:12px;font-family:var(--mono);font-size:10.5px;color:var(--sage);flex-wrap:wrap}
.legend i{width:8px;height:8px;display:inline-block;margin-right:5px}

.tally{background:var(--deep);padding:13px 22px;display:flex;gap:16px;font-family:var(--mono);font-size:11.5px;color:var(--sage);letter-spacing:.03em;flex-wrap:wrap}
.tally b{color:var(--chalk);font-weight:400}

.urgent{background:var(--red);color:#fff;padding:17px 22px;display:flex;align-items:center;gap:16px;width:100%}
.urgent .l{flex:1;min-width:0}
.urgent .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--redink);display:block}
.urgent .t{font-family:var(--disp);font-weight:500;font-size:19px;letter-spacing:-.01em;margin-top:5px;display:block}
.urgent .m{font-size:13px;color:var(--redink);margin-top:3px;display:block}
.urgent .n{font-family:var(--disp);font-weight:800;font-size:40px;line-height:.8;letter-spacing:-.04em;font-variant-numeric:tabular-nums}

.paper{background:var(--chalk);color:var(--ink);padding:22px}
.paper .eyebrow{opacity:.5}
.row{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--pline);width:100%}
.row:last-child{border-bottom:none}
.row .d{font-family:var(--mono);font-size:12.5px;opacity:.45;width:36px;flex-shrink:0;padding-top:3px;font-variant-numeric:tabular-nums}
.row .b{flex:1;min-width:0}
.row h4{margin:0;font-family:var(--disp);font-weight:500;font-size:17px;letter-spacing:-.01em}
.row p{margin:4px 0 0;font-size:13.5px;opacity:.62;line-height:1.45}
.row.done h4{text-decoration:line-through;opacity:.4}
.row.done p{opacity:.35}
.claim{width:24px;height:24px;border:1.5px solid rgba(7,26,18,.28);border-radius:50%;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:transparent}
.row.taken .claim{border-color:var(--pine);color:var(--pine)}
.row.done .claim{background:var(--pine);border-color:var(--pine);color:var(--chalk)}
.by{font-family:var(--mono);font-size:11px;opacity:.5;margin-top:5px;display:block}
.flag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;background:var(--red);color:#fff;padding:2px 6px;margin-left:7px;vertical-align:2px}
.flag.wait{background:rgba(7,26,18,.1);color:rgba(7,26,18,.6)}

.blk{padding:22px}
.blk h3{font-family:var(--disp);font-weight:500;font-size:21px;letter-spacing:-.015em;margin:0 0 4px}
.drow{display:flex;gap:13px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line);width:100%}
.drow:last-child{border-bottom:none}
.drow .b{flex:1;min-width:0}
.drow h4{margin:0;font-size:15.5px;font-weight:500}
.drow p{margin:3px 0 0;font-size:12.5px;color:var(--sage);line-height:1.45}
.st{font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:3px 7px;flex-shrink:0;margin-top:2px}
.st.todo{background:rgba(233,237,231,.1);color:var(--sage)}
.st.sent{background:var(--sage);color:var(--pine)}
.st.ok{background:var(--chalk);color:var(--pine)}

.pipe{display:flex;align-items:center;margin:18px 0 8px}
.pipe .n{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--sage);flex-shrink:0}
.pipe .n.on{background:var(--sage)}
.pipe .n.now{background:var(--red);border-color:var(--red)}
.pipe .s{flex:1;height:1px;background:var(--line)}
.pipelab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--sage)}

.conf{background:var(--chalk);color:var(--ink);padding:20px 22px;border-top:3px solid var(--red)}
.conf .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--red)}
.opt{border:1px solid rgba(7,26,18,.16);padding:12px 14px;margin-top:9px;display:flex;justify-content:space-between;align-items:center;width:100%}
.opt.pick{border-color:var(--ink);background:rgba(7,26,18,.05)}
.opt .v{font-family:var(--mono);font-size:16px}
.opt .src{font-size:11.5px;opacity:.5;margin-top:3px}
.reason{font-size:13.5px;line-height:1.5;opacity:.7;margin-top:14px}
.btn{display:block;width:100%;text-align:center;padding:13px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;background:var(--ink);color:var(--chalk);margin-top:11px}
.btn.ghost{background:none;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(7,26,18,.25)}
.btn.dark{background:var(--chalk);color:var(--ink)}
.btn.dghost{background:none;color:var(--chalk);box-shadow:inset 0 0 0 1px var(--line)}
.stg{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);width:100%}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;padding:2px 6px;flex-shrink:0}
.tag.new{background:var(--sage);color:var(--pine)}
.tag.edit{background:rgba(233,237,231,.14);color:var(--chalk)}

.nav{position:fixed;bottom:0;left:0;right:0;background:var(--ink);border-top:1px solid var(--line);display:flex;max-width:460px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom);z-index:10}
.nav button{flex:1;padding:13px 4px 15px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--sage);opacity:.6;position:relative;text-align:center}
.nav button.on{opacity:1;color:var(--chalk)}
.nav button.on::before{content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:22px;height:2px;background:var(--red)}
.dot{position:absolute;top:9px;right:calc(50% - 24px);width:6px;height:6px;border-radius:50%;background:var(--red)}

.seg{display:flex;margin-top:14px}
.seg button{flex:1;padding:10px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;border:1px solid var(--line);color:var(--sage);text-align:center}
.seg button.on{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
.mrow{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;gap:12px}
.mrow:last-child{border-bottom:none}
.mrow span:last-child{font-family:var(--mono);font-size:13px;color:var(--sage);text-align:right}
.sync{font-family:var(--mono);font-size:10.5px;color:var(--sage);display:flex;align-items:center;gap:6px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--sage);display:inline-block}
.sync.off i{background:var(--red)}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.cell.in{animation:none;opacity:1}}
</style>

<div id="app"></div>
<nav class="nav" id="nav"></nav>

<script>
const BUILD='003';

const mem={};
const disk={
  get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return mem[k]??null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}
};

const qs=new URLSearchParams(location.search);
let FAM=qs.get('f')||disk.get('fam')||null;
if(FAM){FAM=String(FAM).replace(/[^a-z0-9-]/gi,'').slice(0,40);disk.set('fam',FAM)}
let ME=disk.get('me')||null;
const newFam=()=>'f-'+Math.random().toString(36).slice(2,8)+Math.random().toString(36).slice(2,6);
const newMember=()=>'m'+Math.random().toString(36).slice(2,8);

const FEES={KG1:{t1:13491,t2:13494,t3:13494},KG2:{t1:15215,t2:15218,t3:15218}};
let YG='KG1';

const FACTS=[
 {id:'fee-t1',title:'Term 1 fees',due:'2026-08-28',blocking:true,note:()=>'AED '+FEES[YG].t1.toLocaleString()+" · unpaid means she can't start"},
 {id:'rep-form',title:'Class rep form opens',due:'2026-08-24',note:()=>'4pm, only if you want the role'},
 {id:'hd-info',title:'Homeroom teacher makes contact',due:'2026-08-26',waiting:true,note:()=>'Hopes and dreams slot, stationery list'},
 {id:'cca-info',title:'CCA list published',due:'2026-08-28'},
 {id:'cca-signup',title:'CCA sign-up',due:'2026-08-29',note:()=>'Window shuts 1 Sep'},
 {id:'hopes',title:'Hopes and dreams',due:'2026-08-31',note:()=>'Meet the teacher. Uniform sale in the foyer 07:30–12:00'},
 {id:'firstday',title:'First day',due:'2026-08-31',anchor:true,contested:true,note:()=>'Settling-in week to 4 Sep · no school bus for KG'},
 {id:'ccas',title:'CCAs begin',due:'2026-09-07'},
 {id:'infosess',title:'Parent info sessions',due:'2026-09-14',note:()=>'Runs to 17 Sep'},
 {id:'midterm',title:'Mid-term break',due:'2026-10-12',note:()=>'to 16 Oct'},
 {id:'pd1',title:'PD day — early dismissal',due:'2026-10-29'},
 {id:'ptc1',title:'Parent teacher consultations',due:'2026-11-03',note:()=>'No school for primary'},
 {id:'natday',title:'UAE National Day',due:'2026-12-02',note:()=>'to 4 Dec'},
 {id:'winter',title:'Winter break',due:'2026-12-14',note:()=>'to 3 Jan'},
 {id:'fee-t2',title:'Term 2 fees',due:'2026-12-31',blocking:true,note:()=>'AED '+FEES[YG].t2.toLocaleString()},
 {id:'resume',title:'Lessons resume',due:'2027-01-04'},
 {id:'pd2',title:'PD day — early dismissal',due:'2027-02-02'},
 {id:'eidfitr',title:'Eid Al Fitr',due:'2027-03-08',note:()=>'to 12 Mar'},
 {id:'pd3',title:'PD day — early dismissal',due:'2027-03-25'},
 {id:'ptc2',title:'Parent teacher consultations',due:'2027-03-31'},
 {id:'spring',title:'Spring break',due:'2027-04-05',note:()=>'to 9 Apr'},
 {id:'fee-t3',title:'Term 3 fees',due:'2027-04-09',blocking:true,note:()=>'AED '+FEES[YG].t3.toLocaleString()},
 {id:'eidadha',title:'Eid Al Adha',due:'2027-05-15',note:()=>'to 18 May'},
 {id:'ptc3',title:'Parent teacher consultations',due:'2027-05-24'},
 {id:'endyear',title:'End of year',due:'2027-07-02'}
];

const DOCS=[
 {id:'d1',t:'Student passport',g:'Identity'},
 {id:'d2',t:'Both parents passports',g:'Identity'},
 {id:'d3',t:'Student Emirates ID',g:'Identity',n:'Front and back, colour'},
 {id:'d4',t:'Both parents Emirates ID',g:'Identity',n:'Front and back, colour'},
 {id:'d5',t:'Residence visas',g:'Identity'},
 {id:'d6',t:'Birth certificate',g:'KHDA',n:'English or Arabic'},
 {id:'d7',t:'Transfer certificate',g:'KHDA'},
 {id:'d8',t:'2025-26 school report',g:'School'},
 {id:'d9',t:'Confidential report',g:'School',n:'Old school sends this, not you',wait:true},
 {id:'d10',t:'Health and clinic form',g:'Clinic'},
 {id:'d11',t:'Immunisation record',g:'Clinic'},
 {id:'d12',t:'Terms and conditions',g:'Forms'},
 {id:'d13',t:'Parent undertaking',g:'Forms'},
 {id:'d14',t:'Toilet training undertaking',g:'Forms',n:'KG only'},
 {id:'d15',t:'Language option form',g:'Forms'}
];
const KHDA=['Documents in','School enters','You verify','Sign contract'];

const RULES=[
 {k:'Gate opens',v:()=>YG==='KG1'?'07:15':'07:00'},
 {k:'Entrance',v:()=>YG==='KG1'?'Montgomerie campus':'Kiss and drop'},
 {k:'Register',v:()=>'07:30 - 07:38'},
 {k:'Marked absent',v:()=>'after 07:40'},
 {k:'Pick-up',v:()=>'13:20, classrooms'},
 {k:'Friday out',v:()=>'11:30'},
 {k:'Absence form',v:()=>'before 08:00'},
 {k:'Lunchbox',v:()=>'no nuts, sweets, fizzy'}
];

const CONTACTS=[
 {n:'Primary office',d:'pssecretary@diadubai.com',p:'04 871 3530'},
 {n:'Head of year',s:()=>YG==='KG1'?'Jessica Simon':'Amber Corfe',d:()=>YG==='KG1'?'jessicas@diadubai.com':'amberc@diadubai.com'},
 {n:'Head of primary',s:'Tom Collar',d:'tomc@diadubai.com'},
 {n:'Admissions',d:'admissions@diadubai.com',p:'04 871 3502'},
 {n:'Accounts',d:'accounts@diadubai.com'},
 {n:'Bus - Arab Falcon',d:'csr.diaeh@arabfalcondubai.ae',p:'050 1042285'},
 {n:'Canteen - Kalo',d:'hello@kalohospitality.com'}
];

const STAGED=[
 {id:'s1',kind:'conflict',field:'First day',
  a:{v:'1 Sep',src:'Welcome pack calendar'},
  b:{v:'31 Aug',src:'Calendar outline, KG1 row'},
  why:'The incoming source names KG1 on its own line. The stored one lumps KG1 in with KG2, which is how this error usually happens. Leaning 31 Aug, but the office should confirm.'},
 {id:'s2',kind:'new',t:'CCA sign-up opens',m:'29 Aug · task'},
 {id:'s3',kind:'edit',t:'KG pick-up to 13:20',m:'was 13:00 · rule'},
 {id:'s4',kind:'new',t:'Toilet training undertaking',m:'form · KG only'},
 {id:'s5',kind:'new',t:'No bus for KG in week 1',m:'rule · expires 7 Sep'}
];

let L=(FAM&&disk.get('runway:'+FAM))||{};
let pending=new Set();
let online=true;
let view='runway';

const saveLocal=()=>{if(FAM)disk.set('runway:'+FAM,L)};
const get=(k,d)=>L[k]||d;

const members=()=>Object.keys(L).filter(k=>k.indexOf('member:')===0)
  .map(k=>({id:k.slice(7),name:(L[k]&&L[k].name)||'?'}))
  .sort((a,b)=>a.name.localeCompare(b.name));
const nameOf=id=>{const m=L['member:'+id];return (m&&m.name)||'someone'};
const initialOf=id=>{const n=nameOf(id);return n.trim().charAt(0).toUpperCase()||'?'};
const tintOf=id=>{let s=0;for(let i=0;i<String(id).length;i++)s+=String(id).charCodeAt(i);return s%2?'z':''};
const others=()=>members().filter(m=>m.id!==ME);

function write(k,v){
  L[k]=Object.assign({},v,{at:Date.now(),who:ME});
  saveLocal();pending.add(k);render();queuePush();
}
function mergeIn(remote){
  let touched=false;
  for(const k in (remote||{})){
    const v=remote[k];
    if(!v||typeof v!=='object')continue;
    if(!L[k]||(Number(v.at)||0)>(Number(L[k].at)||0)){L[k]=v;touched=true}
  }
  if(touched)saveLocal();
  return touched;
}

let pushTimer=null;
function queuePush(){clearTimeout(pushTimer);pushTimer=setTimeout(push,600)}

async function push(){
  if(!FAM||!pending.size)return;
  const body={};pending.forEach(k=>{if(L[k])body[k]=L[k]});
  try{
    const r=await fetch('/api/state?f='+encodeURIComponent(FAM),
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok)throw new Error('bad');
    const server=await r.json();
    pending.clear();online=true;
    if(mergeIn(server))render();else paintSync();
  }catch(e){online=false;paintSync()}
}
async function pull(){
  if(!FAM)return;
  try{
    const r=await fetch('/api/state?f='+encodeURIComponent(FAM),{cache:'no-store'});
    if(!r.ok)throw new Error('bad');
    online=true;
    if(mergeIn(await r.json()))render();else paintSync();
  }catch(e){online=false;paintSync()}
}

const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const D=s=>new Date(s+'T00:00:00');
const days=(a,b)=>Math.round((b-a)/864e5);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt=d=>d.getDate()+' '+MON[d.getMonth()];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const val=x=>typeof x==='function'?x():x;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);
  return m<1?'just now':m<60?m+'m ago':m<1440?Math.round(m/60)+'h ago':Math.round(m/1440)+'d ago'};

const fstate=id=>get('fact:'+id,{status:'open'});
const upcoming=()=>FACTS.filter(f=>D(f.due)>=today()).sort((a,b)=>D(a.due)-D(b.due));
const anchorFact=()=>upcoming().find(f=>f.anchor)||upcoming()[0];
const nextBlocking=()=>upcoming().find(f=>f.blocking&&fstate(f.id).status!=='done');

function attention(){
  const out=[];
  const soon=new Date(today().getTime()+7*864e5);
  upcoming().filter(f=>f.blocking&&D(f.due)<=soon&&fstate(f.id).status==='open')
    .forEach(f=>out.push(f.title+' is unclaimed and due '+fmt(D(f.due))+'.'));
  const m={};
  upcoming().forEach(f=>{if(!m[f.due])m[f.due]=[];m[f.due].push(f)});
  Object.keys(m).filter(k=>m[k].length>1).slice(0,2).forEach(k=>{
    out.push(m[k].map(x=>x.title).join(' and ')+' both land on '+fmt(D(k))+'.')});
  return out;
}

function setup(){
  if(!FAM) return '<div class="blk" style="padding-top:60px">'+
    '<span class="eyebrow">runway</span>'+
    '<h3 style="margin-top:16px;font-size:26px">One app, both parents.</h3>'+
    '<p style="font-size:14.5px;color:var(--sage);margin-top:10px;line-height:1.55">Start a family space, then send the link to the other phone. Whatever one of you claims, the other sees.</p>'+
    '<button class="btn dark" data-mkfam="1">start a family space</button>'+
    '<p class="eyebrow" style="margin:26px 0 8px">or join one you were sent</p>'+
    '<input id="joinid" placeholder="paste the link or code" autocapitalize="off" autocorrect="off">'+
    '<button class="btn dghost" data-join="1">join</button></div>';

  const link=location.origin+'/?f='+FAM;
  const list=members();
  return '<div class="blk" style="padding-top:52px">'+
    '<span class="eyebrow">runway</span>'+
    '<h3 style="margin-top:16px;font-size:26px">'+(list.length?'Who is holding the phone?':'Your family space is live.')+'</h3>'+
    (list.length?'':'<p style="font-size:14.5px;color:var(--sage);margin-top:10px;line-height:1.55">This code is the whole login. Anyone with the link is in, so keep it between the two of you.</p>')+
    '<div class="mrow" style="margin-top:16px"><span>Family code</span><span>'+esc(FAM)+'</span></div>'+
    '<button class="btn dghost" data-share="'+esc(link)+'">copy the link for the other phone</button>'+
    (list.length?'<p class="eyebrow" style="margin:26px 0 6px">already here</p>'+
      list.map(m=>'<button class="btn dark" data-be="'+esc(m.id)+'">'+esc(m.name)+'</button>').join(''):'')+
    '<p class="eyebrow" style="margin:26px 0 8px">'+(list.length?'not one of them?':'add yourself')+'</p>'+
    '<input id="myname" placeholder="your first name" autocapitalize="words">'+
    '<button class="btn dark" data-addme="1">that is me</button>'+
    (list.length?'':'<p style="font-size:13px;color:var(--sage);margin-top:14px;line-height:1.5">The other parent adds their own name when they open the link.</p>')+
    '</div>';
}

function runway(){
  const a=anchorFact(), n=days(today(),D(a.due)), u=nextBlocking();
  const cells=[];
  for(let i=0;i<=n;i++){
    const d=new Date(today().getTime()+i*864e5), k=iso(d);
    const on=FACTS.filter(f=>f.due===k);
    const hot=on.some(f=>f.blocking&&fstate(f.id).status==='open');
    const held=on.some(f=>fstate(f.id).status==='taken');
    const cls=hot?'hot':held?'held':on.length?'ev':'gone';
    cells.push('<div class="cell '+cls+(i===0?' day0':'')+'" style="animation-delay:'+Math.min(i*12,760)+'ms">'+((on.length||i===0)?d.getDate():'')+'</div>');
  }
  const mine=upcoming().filter(f=>fstate(f.id).status==='taken'&&fstate(f.id).by===ME).length;
  const free=upcoming().filter(f=>f.blocking&&fstate(f.id).status==='open').length;
  const theirTally=others().map(function(m){
    const c=upcoming().filter(f=>fstate(f.id).status==='taken'&&fstate(f.id).by===m.id).length;
    return '<span><b>'+c+'</b> with '+esc(m.name)+'</span>';
  }).join('');

  return '<div class="hero">'+
    '<div class="hbar"><span class="who"><span class="av '+tintOf(ME)+'">'+esc(initialOf(ME))+'</span>'+
    '<span class="eyebrow" style="opacity:.7">'+YG.toLowerCase()+' · dia eh</span></span>'+
    '<span class="sync '+(online?'':'off')+'"><i></i>'+(online?'synced':'offline')+'</span></div>'+
    '<div class="count"><b>'+n+'</b>'+(a.contested?'<span class="ish">ish</span>':'')+'</div>'+
    '<div class="lede">sleeps until her first day</div>'+
    '<div class="sub">'+(a.contested?'Two calendars disagree - 31 Aug or 1 Sep.':fmt(D(a.due)))+'</div>'+
    '<div class="reg">'+cells.join('')+'</div>'+
    '<div class="legend"><span><i style="background:var(--red)"></i>nobody has it</span>'+
    '<span><i style="background:var(--sage)"></i>claimed or coming</span>'+
    '<span><i style="box-shadow:inset 0 0 0 2px var(--chalk)"></i>today</span></div></div>'+

    '<div class="tally"><span><b>'+mine+'</b> with you</span>'+
    theirTally+
    '<span><b>'+free+'</b> unclaimed</span></div>'+

    (u?'<button class="urgent" data-view="year"><span class="l">'+
      '<span class="k">first hard deadline</span>'+
      '<span class="t">'+esc(u.title)+'</span>'+
      '<span class="m">'+esc(val(u.note)||'')+'</span></span>'+
      '<span class="n">'+days(today(),D(u.due))+'</span></button>':'')+

    '<div class="paper"><div class="eyebrow">what is next</div>'+
    upcoming().slice(0,7).map(function(f){
      const s=fstate(f.id);
      return '<button class="row '+s.status+'" data-tog="'+f.id+'">'+
        '<span class="d">'+fmt(D(f.due))+'</span><span class="b">'+
        '<h4>'+esc(f.title)+(f.contested?'<span class="flag">contested</span>':'')+
        (f.waiting?'<span class="flag wait">school</span>':'')+'</h4>'+
        (val(f.note)?'<p>'+esc(val(f.note))+'</p>':'')+
        ((s.status!=='open'&&s.by)?'<span class="by">'+(s.status==='done'?'done':'taken')+' by '+esc(s.by===ME?'you':nameOf(s.by))+' · '+ago(s.at)+'</span>':'')+
        '</span><span class="claim">'+(s.by?esc(initialOf(s.by)):'✓')+'</span></button>';
    }).join('')+'</div>'+

    (attention().length?'<div class="blk" style="background:var(--deep)"><div class="eyebrow">worth a look</div>'+
      attention().map(t=>'<div class="drow"><div class="b"><h4 style="font-weight:400">'+esc(t)+'</h4></div></div>').join('')+'</div>':'');
}

function inbox(){
  const c=STAGED.filter(s=>s.kind==='conflict'&&!get('conf:'+s.id))[0];
  const rest=STAGED.filter(s=>s.kind!=='conflict'&&!get('drop:'+s.id));
  const pick=get('pick',{}).v;
  return '<div class="blk"><div style="display:flex;justify-content:space-between">'+
    '<span class="eyebrow">inbox</span><span class="eyebrow">'+(rest.length+(c?1:0))+' staged</span></div>'+
    '<h3 style="margin-top:16px">Nothing is saved until one of you accepts it.</h3>'+
    '<p style="font-size:13.5px;color:var(--sage);margin:6px 0 0">Pulled from the welcome pack and the calendar outline.</p></div>'+
    (c?'<div class="conf"><div class="k">conflict</div><h3 style="margin-top:9px">'+esc(c.field)+'</h3>'+
      '<button class="opt '+(pick==='a'?'pick':'')+'" data-pick="a"><span><span class="v">'+esc(c.a.v)+'</span>'+
      '<span class="src" style="display:block">'+esc(c.a.src)+'</span></span><span class="src">in store</span></button>'+
      '<button class="opt '+(pick==='b'?'pick':'')+'" data-pick="b"><span><span class="v">'+esc(c.b.v)+'</span>'+
      '<span class="src" style="display:block">'+esc(c.b.src)+'</span></span><span class="src">incoming</span></button>'+
      '<p class="reason">'+esc(c.why)+'</p>'+
      '<button class="btn" data-resolve="'+c.id+'">keep the one i picked</button>'+
      '<button class="btn ghost" data-mail="1">ask the office</button></div>':'')+
    '<div class="blk">'+(rest.map(s=>'<button class="stg" data-drop="'+s.id+'">'+
      '<span class="tag '+s.kind+'">'+s.kind+'</span><span class="b">'+
      '<h4 style="margin:0;font-size:15px;font-weight:500">'+esc(s.t)+'</h4>'+
      '<p class="mono" style="margin:3px 0 0;font-size:12px;color:var(--sage)">'+esc(s.m)+'</p></span>'+
      '<span style="color:var(--sage)">✓</span></button>').join('')
      ||'<p style="color:var(--sage);font-size:14px">Inbox clear.</p>')+'</div>';
}

function year(){
  const by={};
  upcoming().forEach(f=>{const d=D(f.due),k=MON[d.getMonth()]+' '+d.getFullYear();if(!by[k])by[k]=[];by[k].push(f)});
  return '<div class="blk"><span class="eyebrow">the year</span>'+
    '<h3 style="margin-top:14px">'+YG+' · 2026-27</h3></div><div class="paper">'+
    Object.keys(by).map(m=>'<div class="eyebrow" style="margin:18px 0 2px">'+m.toLowerCase()+'</div>'+
      by[m].map(function(f){const s=fstate(f.id);
        return '<button class="row '+s.status+'" data-tog="'+f.id+'">'+
        '<span class="d">'+D(f.due).getDate()+'</span><span class="b"><h4>'+esc(f.title)+
        (f.blocking?'<span class="flag">fees</span>':'')+'</h4>'+
        (val(f.note)?'<p>'+esc(val(f.note))+'</p>':'')+
        ((s.status!=='open'&&s.by)?'<span class="by">'+s.status+' · '+esc(s.by===ME?'you':nameOf(s.by))+'</span>':'')+
        '</span><span class="claim">'+(s.by?esc(initialOf(s.by)):'✓')+'</span></button>'}).join('')).join('')+'</div>';
}

function docs(){
  const g={};DOCS.forEach(d=>{if(!g[d.g])g[d.g]=[];g[d.g].push(d)});
  const step=get('khda',{v:1}).v;
  const inn=DOCS.filter(d=>get('doc:'+d.id,{}).status==='ok').length;
  return '<div class="blk"><span class="eyebrow">paperwork</span>'+
    '<h3 style="margin-top:14px">'+inn+' of '+DOCS.length+' in</h3><div class="pipe">'+
    KHDA.map((_,i)=>'<span class="n '+(i<step?'on':'')+' '+(i===step?'now':'')+'"></span>'+(i<3?'<span class="s"></span>':'')).join('')+
    '</div><div class="pipelab">'+KHDA.map(k=>'<span>'+k.split(' ')[0]+'</span>').join('')+'</div>'+
    '<p style="font-size:13px;color:var(--sage);margin-top:10px">'+(step===1?'Step 2 is the school move, not yours.':'Tap to advance when the school confirms.')+'</p>'+
    '<button class="btn dghost" data-khda="1">advance a step</button></div>'+
    Object.keys(g).map(grp=>'<div class="blk" style="padding-top:0">'+
      '<div class="eyebrow" style="margin-bottom:4px">'+grp.toLowerCase()+'</div>'+
      g[grp].map(function(d){const s=get('doc:'+d.id,{status:'todo'});
        return '<button class="drow" data-doc="'+d.id+'"><span class="b"><h4>'+esc(d.t)+'</h4>'+
        (d.n?'<p>'+esc(d.n)+'</p>':'')+
        ((s.by&&s.status!=='todo')?'<p>'+esc(s.by===ME?'you':nameOf(s.by))+' · '+ago(s.at)+'</p>':'')+
        '</span><span class="st '+s.status+'">'+(s.status==='ok'?'in':s.status==='sent'?'sent':(d.wait?'them':'todo'))+'</span></button>'}).join('')+
      '</div>').join('');
}

function day(){
  const link=location.origin+'/?f='+FAM;
  return '<div class="blk"><span class="eyebrow">every day</span>'+
    '<h3 style="margin-top:14px">The shape of a morning</h3><div style="margin-top:14px">'+
    RULES.map(r=>'<div class="mrow"><span>'+esc(r.k)+'</span><span>'+esc(val(r.v))+'</span></div>').join('')+
    '</div><div class="seg"><button data-yg="KG1" class="'+(YG==='KG1'?'on':'')+'">kg1</button>'+
    '<button data-yg="KG2" class="'+(YG==='KG2'?'on':'')+'">kg2</button></div></div>'+
    '<div class="paper"><div class="eyebrow">who to ask</div>'+
    CONTACTS.map(c=>'<div class="row"><span class="b"><h4>'+esc(c.n)+'</h4><p>'+
      (c.s?esc(val(c.s))+' · ':'')+'<a href="mailto:'+esc(val(c.d))+'">'+esc(val(c.d))+'</a>'+
      (c.p?' · '+esc(c.p):'')+'</p></span></div>').join('')+'</div>'+
    '<div class="blk"><span class="eyebrow">this family</span><div style="margin-top:12px">'+
    '<div class="mrow"><span>You are</span><span>'+esc(nameOf(ME))+'</span></div>'+
    '<div class="mrow"><span>Family code</span><span>'+esc(FAM||'-')+'</span></div>'+
    '<div class="mrow"><span>Sync</span><span>'+(online?'connected':'offline, will retry')+'</span></div>'+
    '<div class="mrow"><span>Build</span><span>'+BUILD+'</span></div></div>'+
    '<button class="btn dark" data-share="'+esc(link)+'">copy the link for the other phone</button>'+
    '<button class="btn dghost" data-switch="1">not '+esc(nameOf(ME))+'? switch this phone</button></div>';
}

const VIEWS={runway:runway,inbox:inbox,year:year,docs:docs,day:day};
const TABS=[['runway','runway'],['inbox','inbox'],['year','year'],['docs','docs'],['day','daily']];

function paintSync(){
  const el=document.querySelector('.sync');
  if(el){el.className='sync '+(online?'':'off');el.innerHTML='<i></i>'+(online?'synced':'offline')}
}

function render(){
  YG=get('yg',{v:'KG1'}).v;
  const app=document.getElementById('app'), nav=document.getElementById('nav');
  if(!FAM||!ME){app.innerHTML=setup();nav.style.display='none';return}
  nav.style.display='flex';
  app.innerHTML=VIEWS[view]();
  const badge=STAGED.filter(s=>!get('drop:'+s.id)&&!get('conf:'+s.id)).length;
  nav.innerHTML=TABS.map(t=>'<button data-view="'+t[0]+'" class="'+(view===t[0]?'on':'')+'">'+t[1]+
    ((t[0]==='inbox'&&badge)?'<span class="dot"></span>':'')+'</button>').join('');
  requestAnimationFrame(()=>{document.querySelectorAll('.cell').forEach(c=>c.classList.add('in'))});
}

document.addEventListener('click',async function(e){
  const t=e.target.closest('[data-view],[data-tog],[data-doc],[data-pick],[data-resolve],[data-drop],[data-yg],[data-mail],[data-mkfam],[data-join],[data-be],[data-addme],[data-share],[data-switch],[data-khda]');
  if(!t)return;
  const d=t.dataset;

  if(d.mkfam){FAM=newFam();disk.set('fam',FAM);L={};saveLocal();render();return}
  if(d.join){
    const el=document.getElementById('joinid');
    const raw=el?el.value:'';
    const m=raw.match(/[?&]f=([a-z0-9-]+)/i);
    const code=(m?m[1]:raw).trim().replace(/[^a-z0-9-]/gi,'').slice(0,40);
    if(!code)return;
    FAM=code;disk.set('fam',FAM);L=disk.get('runway:'+FAM)||{};render();pull();return;
  }
  if(d.be){ME=d.be;disk.set('me',ME);render();pull();return}
  if(d.addme){
    const el=document.getElementById('myname');
    const nm=(el&&el.value||'').trim().slice(0,24);
    if(!nm){if(el)el.focus();return}
    ME=newMember();disk.set('me',ME);
    write('member:'+ME,{name:nm});return;
  }
  if(d.switch){ME=null;disk.set('me',null);render();return}
  if(d.share){
    try{await navigator.clipboard.writeText(d.share);t.textContent='copied'}
    catch(err){t.textContent=d.share}
    setTimeout(render,1400);return;
  }
  if(d.view){view=d.view;render();return}
  if(d.tog){
    const s=fstate(d.tog);
    const next=s.status==='open'?{status:'taken',by:ME}:s.status==='taken'?{status:'done',by:ME}:{status:'open',by:null};
    write('fact:'+d.tog,next);return;
  }
  if(d.doc){
    const s=get('doc:'+d.doc,{status:'todo'});
    const next=s.status==='todo'?'sent':s.status==='sent'?'ok':'todo';
    write('doc:'+d.doc,{status:next,by:ME});return;
  }
  if(d.khda){write('khda',{v:Math.min(get('khda',{v:1}).v+1,4)});return}
  if(d.pick){write('pick',{v:d.pick});return}
  if(d.resolve){const p=get('pick',{}).v;if(!p)return;write('conf:'+d.resolve,{v:p});return}
  if(d.drop){write('drop:'+d.drop,{v:true});return}
  if(d.yg){write('yg',{v:d.yg});return}
  if(d.mail){location.href='mailto:pssecretary@diadubai.com?subject=KG1%20start%20date%202026-27&body=Hello%2C%0A%0AThe%20welcome%20pack%20calendar%20and%20the%20calendar%20outline%20give%20different%20first%20days%20for%20KG1%20-%201%20September%20versus%2031%20August.%20Could%20you%20confirm%20which%20is%20correct%3F%0A%0AThank%20you.';return}
});

document.addEventListener('visibilitychange',function(){if(!document.hidden){pull();push()}});
window.addEventListener('online',function(){online=true;pull();push()});
window.addEventListener('offline',function(){online=false;paintSync()});

render();
if(FAM&&ME)pull();
setInterval(function(){if(!document.hidden)pull()},90000);
</script>
