<style>
:root{
  --pine:#0E3B2A; --ink:#071A12; --chalk:#E9EDE7; --sage:#7FA08C;
  --red:#DC3B2B; --redink:#FFD9D4; --deep:#0A2A1E; --amber:#E0A040;
  --line:rgba(233,237,231,.16); --pline:rgba(7,26,18,.13);
  --disp:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Inter Tight',system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--chalk);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{max-width:460px;margin:0 auto;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
#app > .blk:first-child,#app > .paper:first-child{padding-top:calc(env(safe-area-inset-top) + 24px)}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left}
input,textarea{font:inherit;background:rgba(233,237,231,.08);border:1px solid var(--line);color:var(--chalk);padding:12px 13px;width:100%;border-radius:0;margin-top:8px}
textarea{min-height:88px;resize:vertical;line-height:1.45}
input[type=file]{padding:9px;font-size:13px}
label.chk{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14.5px;color:var(--sage)}
label.chk input{width:18px;height:18px;margin:0;accent-color:var(--red)}
.eyebrow{font-family:var(--body);font-size:13px;font-weight:500;opacity:.55}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.hero{background:var(--pine);padding:calc(env(safe-area-inset-top) + 22px) 22px 26px}
.hbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;gap:12px}
.who{display:flex;align-items:center;gap:8px}
.av{width:26px;height:26px;border-radius:50%;background:var(--sage);color:var(--pine);font-family:var(--body);font-weight:500;font-size:13px;display:flex;align-items:center;justify-content:center}
.av.z{background:var(--chalk)}
.sync{font-family:var(--body);font-size:12.5px;color:var(--sage);display:flex;align-items:center;gap:6px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--sage)}
.sync.off i{background:var(--red)}

.today{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.today .dn{font-family:var(--disp);font-weight:800;font-size:64px;line-height:.82;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.today .dl{font-family:var(--disp);font-size:22px;line-height:1.15;letter-spacing:-.015em;margin-top:8px}
.today .ds{font-size:14px;color:var(--sage);margin-top:7px;line-height:1.5}
.tm{text-align:right;flex-shrink:0}
.tm b{display:block;font-family:var(--mono);font-size:24px;font-weight:500;letter-spacing:-.02em;line-height:1.05}
.tm span{display:block;font-size:12px;color:var(--sage);margin-top:3px}
.tm .hot{color:var(--amber)}

.week{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:24px}
.day{background:rgba(7,26,18,.35);padding:9px 7px 10px;min-height:96px;display:flex;flex-direction:column;gap:4px}
.day.now{box-shadow:inset 0 0 0 2px var(--chalk)}
.day.off{background:rgba(233,237,231,.07);opacity:.55}
.day .d{font-family:var(--mono);font-size:11px;color:var(--sage);display:flex;justify-content:space-between}
.day .d b{font-weight:500;color:var(--chalk)}
.day .e{font-size:11px;line-height:1.25;letter-spacing:-.01em;color:var(--chalk);opacity:.9;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.day .e.pay{color:var(--amber)}
.day .e.dress{color:#F0C9A0}
.day .e.off{color:var(--sage)}
.day .more{font-size:10.5px;color:var(--sage)}
.wkn{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12.5px;color:var(--sage)}
.wkn button{color:var(--sage);font-weight:500;padding:6px 0}

.strip{margin-top:22px}
.strip .lab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sage);margin-bottom:7px}
.strip .bar{display:flex;gap:2px;height:14px}
.strip .w{flex:1;background:rgba(233,237,231,.12)}
.strip .w.brk{background:rgba(233,237,231,.04)}
.strip .w.gone{background:var(--sage);opacity:.55}
.strip .w.now{background:var(--chalk)}
.strip .w.pay{box-shadow:inset 0 -3px 0 var(--amber)}

.urgent{background:var(--red);color:#fff;padding:17px 22px;display:flex;align-items:center;gap:16px;width:100%}
.urgent .l{flex:1;min-width:0}
.urgent .k{font-family:var(--body);font-size:12.5px;font-weight:500;color:var(--redink);display:block;opacity:.9}
.urgent .t{font-family:var(--disp);font-weight:500;font-size:19px;margin-top:5px;display:block}
.urgent .m{font-size:13px;color:var(--redink);margin-top:3px;display:block}
.urgent .n{font-family:var(--disp);font-weight:800;font-size:40px;line-height:.8;letter-spacing:-.04em;font-variant-numeric:tabular-nums}

.paper{background:var(--chalk);color:var(--ink);padding:20px 22px 22px}
.paper .eyebrow{opacity:.5}
.phead{display:flex;justify-content:space-between;align-items:center}
.plus{font-family:var(--body);font-size:13.5px;font-weight:500;opacity:.6;padding:6px 0 6px 14px}
.row{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--pline);width:100%}
.row:last-child{border-bottom:none}
.row .d{font-family:var(--mono);font-size:12px;opacity:.42;width:48px;flex-shrink:0;padding-top:4px;font-variant-numeric:tabular-nums;line-height:1.3;white-space:nowrap}
.row .d small{display:block;font-size:10px;opacity:.8}
.row .b{flex:1;min-width:0}
.row h4{margin:0;font-family:var(--disp);font-weight:500;font-size:17.5px;letter-spacing:-.01em;line-height:1.3}
.row p{margin:5px 0 0;font-size:14px;opacity:.62;line-height:1.5}
.row.done h4{text-decoration:line-through;opacity:.38}
.row.done p{opacity:.32}
.claim{width:27px;height:27px;border:1.5px solid rgba(7,26,18,.26);border-radius:50%;flex-shrink:0;margin-top:3px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10.5px;color:transparent}
.row.taken .claim{border-color:var(--pine);color:var(--pine)}
.row.done .claim{background:var(--pine);border-color:var(--pine);color:var(--chalk)}
.by{font-family:var(--body);font-size:12.5px;opacity:.5;margin-top:5px;display:block}
.tt{display:block;width:100%;text-align:left}
.flag{display:inline-block;font-family:var(--body);font-size:11px;font-weight:500;padding:2px 7px;margin-left:6px;vertical-align:2px;background:rgba(7,26,18,.09);color:rgba(7,26,18,.55)}
.flag.hot{background:var(--red);color:#fff}
.flag.pay{background:var(--amber);color:#3a2400}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.links a,.links button{font-family:var(--body);font-size:12.5px;font-weight:500;padding:7px 11px;box-shadow:inset 0 0 0 1px rgba(7,26,18,.2);color:rgba(7,26,18,.72);text-decoration:none;display:inline-block}
.links a:active{background:rgba(7,26,18,.07)}
.links button{opacity:.55}
.links.dk a{box-shadow:inset 0 0 0 1px var(--line);color:var(--sage)}
.gloss{margin:11px 0 2px;font-size:13.5px;line-height:1.6;opacity:.72;border-left:2px solid rgba(7,26,18,.18);padding-left:12px}

.blk{padding:22px}
.blk h3{font-family:var(--disp);font-weight:500;font-size:21px;letter-spacing:-.015em;margin:0 0 4px}
.drow{display:flex;gap:13px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line);width:100%}
.drow:last-child{border-bottom:none}
.drow .b{flex:1;min-width:0}
.drow h4{margin:0;font-size:15.5px;font-weight:500}
.drow p{margin:3px 0 0;font-size:12.5px;color:var(--sage);line-height:1.45}
.st{font-family:var(--body);font-size:11.5px;font-weight:500;padding:4px 8px;flex-shrink:0;margin-top:2px}
.st.todo{background:rgba(233,237,231,.1);color:var(--sage)}
.st.del{background:rgba(220,59,43,.16);color:var(--red)}

.src{border-top:1px solid var(--line);padding:20px 22px}
.src h4{margin:0;font-family:var(--disp);font-weight:500;font-size:18px}
.src .kind{font-family:var(--body);font-size:12.5px;color:var(--sage);margin-top:6px;display:block}
.src .sum{font-size:14px;line-height:1.55;opacity:.82;margin-top:11px}
.fold{font-family:var(--body);font-size:13px;font-weight:500;color:var(--sage);margin-top:14px;display:inline-block;border-bottom:1px solid var(--line);padding-bottom:4px}
.derived{margin-top:12px;border-left:2px solid var(--line);padding-left:13px}
.derived div{font-size:13.5px;line-height:1.5;padding:3px 0;opacity:.75}
.derived .dt{font-family:var(--mono);font-size:11px;color:var(--sage);margin-right:7px}
.alsolist{margin-top:10px}
.alsolist div{font-size:13px;line-height:1.5;color:var(--sage);padding:3px 0 3px 13px;position:relative}
.alsolist div::before{content:"·";position:absolute;left:2px}
.pend{background:var(--chalk);color:var(--ink);margin:14px -22px -20px;padding:16px 22px}

.stg{padding:12px 0;border-bottom:1px solid var(--pline)}
.stg:last-child{border-bottom:none}
.stg h5{margin:0;font-size:15px;font-weight:500}
.stg p{margin:4px 0 0;font-size:12.5px;opacity:.6}
.mini{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.mini button{font-family:var(--body);font-size:13px;font-weight:500;padding:8px 14px;box-shadow:inset 0 0 0 1px rgba(7,26,18,.22);color:rgba(7,26,18,.7)}
.mini button.yes{background:var(--ink);color:var(--chalk);box-shadow:none}
.opt{border:1px solid rgba(7,26,18,.16);padding:11px 13px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;width:100%}
.opt.pick{border-color:var(--ink);background:rgba(7,26,18,.05)}
.opt .v{font-family:var(--mono);font-size:15px}
.opt .s2{font-size:11.5px;opacity:.5}

.btn{display:block;width:100%;text-align:center;padding:14px;font-family:var(--body);font-size:14.5px;font-weight:500;background:var(--ink);color:var(--chalk);margin-top:11px}
.btn.ghost{background:none;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(7,26,18,.25)}
.btn.dark{background:var(--chalk);color:var(--ink)}
.btn.dghost{background:none;color:var(--chalk);box-shadow:inset 0 0 0 1px var(--line)}
.btn.busy{opacity:.5}

.nav{position:fixed;bottom:0;left:0;right:0;background:#061710;border-top:1px solid var(--line);display:flex;max-width:460px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom);z-index:10}
.nav button{flex:1;padding:17px 4px 19px;font-family:var(--body);font-size:14px;font-weight:500;color:rgba(233,237,231,.5);position:relative;text-align:center;transition:color .15s}
.nav button.on{color:var(--chalk)}
.nav button.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:30px;height:3px;background:var(--red)}
.dot{position:absolute;top:13px;right:calc(50% - 30px);width:7px;height:7px;border-radius:50%;background:var(--red)}

.seg{display:flex;margin-top:14px}
.seg button{flex:1;padding:12px;font-family:var(--body);font-size:14px;font-weight:500;border:1px solid var(--line);color:var(--sage);text-align:center}
.seg button.on{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
.filt{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.filt button{font-family:var(--body);font-size:13px;font-weight:500;padding:8px 13px;box-shadow:inset 0 0 0 1px var(--line);color:var(--sage)}
.filt button.on{background:var(--chalk);color:var(--ink);box-shadow:none}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:14.5px;gap:12px;text-align:left}
.mrow:last-child{border-bottom:none}
.mrow span:last-child{font-family:var(--mono);font-size:13px;color:var(--sage);text-align:right}
.portal{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px;text-decoration:none;gap:12px}
.portal:last-child{border-bottom:none}
.portal span:last-child{font-family:var(--mono);font-size:10.5px;color:var(--sage)}
.calbox{background:var(--deep);padding:18px 20px;margin-top:16px}
.calbox h4{margin:0;font-family:var(--disp);font-weight:500;font-size:17px}
.calbox p{font-size:13.5px;color:var(--sage);margin:6px 0 0;line-height:1.5}
.calbox code{display:block;font-family:var(--mono);font-size:11px;background:rgba(0,0,0,.3);padding:10px 12px;margin-top:12px;word-break:break-all;color:var(--chalk);opacity:.85;line-height:1.5}
.back{font-family:var(--body);font-size:13.5px;font-weight:500;color:var(--sage);display:inline-block;margin-bottom:14px}
.note{font-size:13px;color:var(--sage);line-height:1.5;margin-top:12px}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
</style>

let L=(FAM&&disk.get('runway:'+FAM))||{};
let pending=new Set();
let online=true, view='now', busy='', flash='', filter='all', openSrc='', openHelp='', weekOff=0;

const saveLocal=()=>{if(FAM)disk.set('runway:'+FAM,L)};
const get=(k,d)=>L[k]||d;

const members=()=>Object.keys(L).filter(k=>k.indexOf('member:')===0)
  .map(k=>({id:k.slice(7),name:(L[k]&&L[k].name)||'?'})).sort((a,b)=>a.name.localeCompare(b.name));
const nameOf=id=>{const m=L['member:'+id];return (m&&m.name)||'someone'};
const initialOf=id=>{const n=nameOf(id);return n.trim().charAt(0).toUpperCase()||'?'};
const tintOf=id=>{let s=0;for(let i=0;i<String(id).length;i++)s+=String(id).charCodeAt(i);return s%2?'z':''};
const others=()=>members().filter(m=>m.id!==ME);
const child=()=>Object.assign({},CHILD_DEFAULT,get('child',{}));
const firstName=()=>String(child().name||'').trim().split(' ')[0]||'her';
const campus=()=>YG==='KG1'?'Montgomerie':'Main campus';

function write(k,v){
  L[k]=Object.assign({},v,{at:Date.now(),who:ME});
  saveLocal();pending.add(k);render();queuePush();
}
function mergeIn(remote){
  let touched=false;
  for(const k in (remote||{})){
    const v=remote[k];
    if(!v||typeof v!=='object')continue;
    if(!L[k]||(Number(v.at)||0)>(Number(L[k].at)||0)){L[k]=v;touched=true}
  }
  if(touched)saveLocal();
  return touched;
}
let pushTimer=null;
const queuePush=()=>{clearTimeout(pushTimer);pushTimer=setTimeout(push,600)};

/* The calendar feed runs server-side and cannot see SEED, so the client
   mirrors the dated seed items into the blob whenever they change. */
function mirrorSeed(){
  const items=SEED.filter(f=>f.due).map(f=>({id:f.id,title:f.title,due:f.due,until:f.until||null,time:f.time||null,endTime:f.endTime||null,note:val(f.note)||null,blocking:!!f.blocking}));
  const sig=JSON.stringify(items).length+':'+BUILD;
  const cur=get('seedcal',{});
  if(cur.sig===sig)return;
  L['seedcal']={items:items,sig:sig,at:Date.now(),who:ME};
  saveLocal();pending.add('seedcal');queuePush();
}

async function push(){
  if(!FAM||!pending.size)return;
  const body={};pending.forEach(k=>{if(L[k])body[k]=L[k]});
  try{
    const r=await fetch('/api/state?f='+encodeURIComponent(FAM),
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok)throw new Error('bad');
    const server=await r.json();
    pending.clear();online=true;
    if(mergeIn(server))render();else paintSync();
  }catch(e){online=false;paintSync()}
}
async function pull(){
  if(!FAM)return;
  try{
    const r=await fetch('/api/state?f='+encodeURIComponent(FAM),{cache:'no-store'});
    if(!r.ok)throw new Error('bad');
    online=true;
    if(mergeIn(await r.json()))render();else paintSync();
  }catch(e){online=false;paintSync()}
}

const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const D=s=>new Date(s+'T00:00:00');
const days=(a,b)=>Math.round((b-a)/864e5);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmt=d=>d.getDate()+' '+MON[d.getMonth()];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const val=x=>typeof x==='function'?x():x;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);
  return m<1?'just now':m<60?m+'m ago':m<1440?Math.round(m/60)+'h ago':Math.round(m/1440)+'d ago'};
const t12=t=>{if(!t)return'';const [h,m]=t.split(':');const H=+h;return (H%12||12)+(m!=='00'?':'+m:'')+(H<12?'am':'pm')};
const inBreak=d=>{const k=iso(d);return BREAKS.some(b=>k>=b[0]&&k<=b[1])};
const isWeekend=d=>d.getDay()===6||d.getDay()===0;
const schoolDay=d=>!isWeekend(d)&&!inBreak(d);

const isHidden=id=>{const h=get('hide:'+id);return !!(h&&h.v)};
const customFacts=()=>Object.keys(L).filter(k=>k.indexOf('cf:')===0)
  .map(k=>Object.assign({},L[k],{id:k.slice(3),custom:true})).filter(f=>!f.deleted&&f.title);
const items=()=>SEED.filter(f=>!isHidden(f.id)).concat(customFacts());
const stateOf=id=>get('fact:'+id,{status:'open'});

const dated=()=>items().filter(f=>f.due).sort((a,b)=>D(a.due)-D(b.due));
const spans=(f,d)=>{const k=iso(d);return f.due&&k>=f.due&&k<=(f.until||f.due)};
const onDay=d=>dated().filter(f=>spans(f,d));
const ahead=()=>dated().filter(f=>D(f.until||f.due)>=today());
const started=()=>iso(today())>=TERM_START;
const loose=()=>items().filter(f=>!f.due&&!f.group&&!(f.pre&&(started()||stateOf(f.id).status==='done')));
const lingering=()=>items().filter(f=>f.pre&&started()&&stateOf(f.id).status!=='done');
const paperwork=()=>items().filter(f=>f.group==='paperwork');

/* ---------- 1. now ---------- */
function dayCell(d){
  const k=iso(d), isToday=k===iso(today());
  const ev=onDay(d).filter(f=>!f.until||days(D(f.due),D(f.until))<=7);
  const off=!schoolDay(d);
  const early=ev.find(f=>/early|11:40|dismissal/i.test(f.title+' '+(val(f.note)||'')));
  const short=t=>String(t).replace(/^KG1 /,'').replace(/^Second-hand uniform sale$/,'Uniform sale').replace(/^Early finish — .*$/,'Early finish').replace(/^Parent session: /,'Parents: ').replace(/^Pay for /,'Pay: ').replace(/^The Ugly Duckling show$/,'Ugly Duckling').replace(/^Mother tongue classes begin$/,'MT starts');
  const lines=ev.slice(0,3).map(f=>{
    const cls=f.blocking?'pay':f.dress?'dress':'';
    return '<span class="e '+cls+'">'+(f.time&&!f.blocking?'<b style="font-weight:500">'+t12(f.time)+'</b> ':'')+esc(short(f.title))+'</span>';
  });
  return '<div class="day '+(isToday?'now':'')+(off?' off':'')+'">'+
    '<span class="d"><span>'+DOW[d.getDay()]+'</span><b>'+d.getDate()+'</b></span>'+
    (off&&!ev.length?'<span class="e off">'+(isWeekend(d)?'':'break')+'</span>':'')+
    lines.join('')+(ev.length>3?'<span class="more">+'+(ev.length-3)+'</span>':'')+
    '</div>';
}

function termStrip(){
  const start=D(TERM_START), end=D(TERM_END), tot=Math.ceil(days(start,end)/7);
  const nowW=Math.floor(days(start,today())/7);
  const payW=new Set(dated().filter(f=>f.blocking&&stateOf(f.id).status!=='done').map(f=>Math.floor(days(start,D(f.due))/7)));
  const cells=[];
  for(let w=0;w<tot;w++){
    const d=new Date(start.getTime()+w*7*864e5);
    const brk=inBreak(d)&&inBreak(new Date(d.getTime()+2*864e5));
    cells.push('<span class="w '+(brk?'brk':'')+(w<nowW?' gone':'')+(w===nowW?' now':'')+(payW.has(w)?' pay':'')+'"></span>');
  }
  const left=dated().filter(f=>D(f.due)>=today()&&f.title.toLowerCase().indexOf('break')>=0)[0];
  return '<div class="strip"><div class="lab"><span>week '+(nowW+1)+' of '+tot+'</span>'+
    '<span>'+(left?days(today(),D(left.due))+' days to '+esc(left.title.toLowerCase()):'')+'</span></div>'+
    '<div class="bar">'+cells.join('')+'</div></div>';
}

function nowView(){
  const t=today(), tk=iso(t), dow=t.getDay();
  const tEv=onDay(t), u=nextBlocking();
  const off=!schoolDay(t);
  const early=tEv.find(f=>f.time&&/early|dismissal|finish/i.test(f.title));
  const fri=dow===5;
  const gate=YG==='KG1'?'07:15':'07:00';
  const out=early?early.time:(fri?'11:30':'13:20');
  const dress=tEv.filter(f=>f.dress);

  const monday=new Date(t.getTime()-((dow+6)%7)*864e5+weekOff*7*864e5);
  const week=[];for(let i=0;i<5;i++)week.push(new Date(monday.getTime()+i*864e5));
  const wkLabel=weekOff===0?'this week':weekOff===1?'next week':fmt(week[0])+' – '+fmt(week[4]);

  const pw=paperwork(), pwIn=pw.filter(f=>stateOf(f.id).status==='done').length;
  const openLoose=loose().filter(f=>stateOf(f.id).status!=='done');
  const soon=ahead().filter(f=>f!==u&&!(f.until&&f.until!==f.due&&days(D(f.due),D(f.until))>7)).slice(0,6);
  const mine=items().filter(f=>stateOf(f.id).status==='taken'&&stateOf(f.id).by===ME).length;
  const theirs=others().map(m=>({m:m,c:items().filter(f=>stateOf(f.id).status==='taken'&&stateOf(f.id).by===m.id).length}));

  const headline=off?(isWeekend(t)?'No school today.':'Break — no school.')
    :early?'Early finish today, '+t12(early.time)+'.'
    :dress.length?esc(dress[0].title)+'.'
    :fri?'Friday — short day.':'Normal day.';
  const sub=off?(isWeekend(t)?'':esc((tEv[0]||{}).title||''))
    :(dress.length?esc(val(dress[0].note)||''):(early?esc(val(early.note)||''):'Gate '+gate+' at '+campus()+', register closes 07:40.'));

  return '<div class="hero">'+
    '<div class="hbar"><span class="who"><span class="av '+tintOf(ME)+'">'+esc(initialOf(ME))+'</span>'+
    '<span style="font-size:13.5px;opacity:.72">'+esc(firstName())+' · '+YG+'</span></span>'+
    '<span class="sync '+(online?'':'off')+'"><i></i>'+(online?'synced':'offline')+'</span></div>'+
    '<div class="today"><div>'+
      '<div class="dn">'+DOW[dow]+'</div>'+
      '<div class="dl">'+headline+'</div>'+
      (sub?'<div class="ds">'+sub+'</div>':'')+
    '</div>'+
    (off?'':'<div class="tm"><b>'+gate+'</b><span>gate</span><b class="'+(early?'hot':'')+'" style="margin-top:10px">'+out+'</b><span>out</span></div>')+
    '</div>'+
    '<div class="week">'+week.map(dayCell).join('')+'</div>'+
    '<div class="wkn"><button data-wk="-1">‹ prev</button><span>'+wkLabel+'</span><button data-wk="1">next ›</button></div>'+
    termStrip()+
    '</div>'+

    (u?'<button class="urgent" data-view="all"><span class="l"><span class="k">next payment</span>'+
      '<span class="t">'+esc(u.title)+'</span><span class="m">'+esc(val(u.note)||'')+'</span></span>'+
      '<span class="n">'+days(today(),D(u.due))+'</span></button>':'')+

    '<div class="paper"><div class="phead"><span class="eyebrow">coming up</span>'+
    '<button class="plus" data-view="add">+ add</button></div>'+
    ((pwIn<pw.length&&!started())?'<button class="row" data-view="all" data-f="paperwork"><span class="d">—</span><div class="b">'+
      '<h4>Paperwork</h4><p>'+pwIn+' of '+pw.length+' in — tap to finish</p></div></button>':'')+
    soon.map(row).join('')+
    openLoose.map(row).join('')+
    '</div>'+
    (lingering().length?'<div class="blk" style="padding-top:18px"><button class="fold" data-view="all" data-f="pre">'+lingering().length+' pre-joining task'+(lingering().length===1?'':'s')+' still open — probably done, tap to tidy</button></div>':'')+

    '<div class="blk" style="background:var(--deep);padding:15px 22px">'+
    '<div style="display:flex;gap:15px;flex-wrap:wrap;font-size:12.5px;color:var(--sage)"><span>'+mine+' with you</span>'+
    theirs.map(x=>'<span>'+x.c+' with '+esc(x.m.name)+'</span>').join('')+
    '<span>tap a circle to take it, again when done</span></div></div>';
}

/* ---------- 2. all ---------- */
function all(){
  const f=filter;
  if(f==='hidden'){
    const back=SEED.filter(x=>isHidden(x.id));
    return '<div class="blk"><div class="phead"><span class="eyebrow">everything</span>'+
      '<button class="plus" data-view="add">+ add</button></div><h3 style="margin-top:14px">Set aside</h3>'+
      filtRow(f)+'</div><div class="paper">'+(back.length?back.map(x=>'<div class="row"><span class="d">'+
        (x.due?fmt(D(x.due)):'—')+'</span><div class="b"><h4 style="opacity:.55">'+esc(x.title)+'</h4>'+
        '<div class="links"><button data-unnix="'+esc(x.id)+'">bring it back</button></div></div></div>').join('')
        :'<p style="opacity:.5;font-size:14px">Nothing set aside.</p>')+'</div>';
  }
  let list=items();
  if(f==='paperwork')list=paperwork();
  else if(f==='mine')list=list.filter(x=>stateOf(x.id).by===ME&&stateOf(x.id).status!=='done');
  else if(f==='open')list=list.filter(x=>stateOf(x.id).status==='open');
  else if(f==='pay')list=list.filter(x=>x.blocking);
  else if(f==='pre')list=list.filter(x=>x.pre);
  else if(f==='done')list=list.filter(x=>stateOf(x.id).status==='done');
  if(f!=='done')list=list.filter(x=>!x.due||D(x.until||x.due)>=today()||stateOf(x.id).status!=='done');
  if(f==='all')list=list.filter(x=>!x.pre);

  const nodate=list.filter(x=>!x.due);
  const withdate=list.filter(x=>x.due).sort((a,b)=>D(a.due)-D(b.due));
  const by={};withdate.forEach(x=>{const d=D(x.due),k=MON[d.getMonth()]+' '+d.getFullYear();if(!by[k])by[k]=[];by[k].push(x)});
  return '<div class="blk"><div class="phead"><span class="eyebrow">everything</span>'+
    '<button class="plus" data-view="add">+ add</button></div>'+
    '<h3 style="margin-top:14px">'+YG+' · 2026-27</h3>'+filtRow(f)+'</div>'+
    '<div class="paper">'+
    (nodate.length?'<div class="eyebrow">no date</div>'+nodate.map(row).join(''):'')+
    Object.keys(by).map(m=>'<div class="eyebrow" style="margin:20px 0 2px">'+m.toLowerCase()+'</div>'+by[m].map(row).join('')).join('')+
    (!nodate.length&&!withdate.length?'<p style="opacity:.5;font-size:14px">Nothing here.</p>':'')+'</div>';
}
function filtRow(f){
  return '<div class="filt">'+[['all','all'],['open','unclaimed'],['mine','mine'],['pay','payments'],['paperwork','paperwork'],['pre','pre-joining'],['done','done'],['hidden','set aside']]
    .map(x=>'<button data-f="'+x[0]+'" class="'+(f===x[0]?'on':'')+'">'+x[1]+'</button>').join('')+'</div>';
}

  return '<div class="blk"><button class="back" data-view="now">← back</button><h3>Add something</h3>'+
    '<p class="note">Leave the date empty if it just needs doing at some point.</p>'+
    '<input id="ntitle" placeholder="what is it" autocapitalize="sentences">'+
    '<input id="ndue" type="date"><input id="ntime" type="time">'+
    '<input id="nnote" placeholder="detail, amount, where — optional">'+
    '<label class="chk"><input type="checkbox" id="nblock"> it is a payment or hard deadline</label>'+
    '<button class="btn dark" data-save="1">add it</button></div>'+
    (custom.length?'<div class="paper"><div class="eyebrow">things you added</div>'+
      custom.map(f=>'<div class="row"><span class="d">'+(f.due?fmt(D(f.due)):'—')+'</span><span class="b"><h4>'+esc(f.title)+'</h4>'+(f.note?'<p>'+esc(f.note)+'</p>':'')+'</span>'+
        '<button class="st del" data-del="'+esc(f.id)+'">remove</button></div>').join('')+'</div>':'');
}

/* ---------- render ---------- */
const VIEWS={now:nowView,all:all,papers:papers,info:info,add:addview};
const TABS=[['now','today'],['all','all'],['papers','papers'],['info','info']];
function paintSync(){const el=document.querySelector('.sync');if(el){el.className='sync '+(online?'':'off');el.innerHTML='<i></i>'+(online?'synced':'offline')}}
function render(){
  YG=get('yg',{v:'KG1'}).v;
  const app=document.getElementById('app'), nav=document.getElementById('nav');
  if(!FAM||!ME){app.innerHTML=setup();nav.style.display='none';return}
  nav.style.display='flex';
  app.innerHTML=(VIEWS[view]||nowView)();
  const w=waiting();
  nav.innerHTML=TABS.map(t=>'<button data-view="'+t[0]+'" class="'+(view===t[0]?'on':'')+'">'+t[1]+((t[0]==='papers'&&w)?'<span class="dot"></span>':'')+'</button>').join('');
}

function b64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(new Error('could not read that file'));r.readAsDataURL(file)})}

async function readSource(mode){
  const payload={yg:YG,childName:firstName(),existing:items().map(f=>({id:f.id,title:f.title,due:f.due||null}))};
  if(mode==='url'){
    const u=(document.getElementById('nlurl')||{}).value||'';
    if(!/^https?:\/\//.test(u.trim())){flash='Paste the newsletter link first.';render();return}
    payload.url=u.trim();
  }else{
    const ta=document.getElementById('paste'), fi=document.getElementById('pdf');
    const text=(ta&&ta.value||'').trim(), file=fi&&fi.files&&fi.files[0];
    if(!text&&!file){flash='Paste something or pick a PDF first.';render();return}
    if(file&&file.size>4000000){flash='That PDF is over 4MB. Paste the newsletter link instead — the server fetches it directly.';render();return}
    if(file){payload.pdf=await b64(file);payload.filename=file.name}else payload.text=text;
  }
  busy='1';flash='';render();
  try{
    const r=await fetch('/api/extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const data=await r.json();
    if(!r.ok){flash='Could not read it: '+(data.error||'unknown');busy='';render();return}
    const sid=newId('d');
    L['src:'+sid]={title:data.title,summary:data.summary,also:data.also||[],issued:data.issued||null,url:data.url||null,kind:'Newsletter · added by '+nameOf(ME),at:Date.now(),who:ME};
    pending.add('src:'+sid);
    (data.proposals||[]).forEach(p=>{const k='st:'+newId('s');L[k]=Object.assign({},p,{srcId:sid,at:Date.now(),who:ME});pending.add(k)});
    saveLocal();
    const n=(data.proposals||[]).length;
    flash=n?(n+' found for '+firstName()+'. Keep or discard below.'):'Read it — nothing new for '+firstName()+'.';
    openSrc=sid;busy='';render();queuePush();
    setTimeout(()=>{const el=document.querySelector('.pend');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},80);
  }catch(e){flash='That did not go through. '+String(e.message||e);busy='';render()}
}

function acceptStaged(sid){
  const s=L['st:'+sid];if(!s)return;
  write('cf:'+newId('c'),{title:s.title,due:s.due||null,until:s.until||null,time:s.time||null,endTime:s.endTime||null,note:s.note||null,blocking:!!s.blocking,dress:!!s.dress,src:s.srcId||'added'});
  write('st:'+sid,Object.assign({},s,{settled:true}));
}

document.addEventListener('click',async function(e){
  const t=e.target.closest('[data-view],[data-tog],[data-yg],[data-mkfam],[data-join],[data-be],[data-addme],[data-share],[data-switch],[data-save],[data-del],[data-nix],[data-unnix],[data-read],[data-accept],[data-acceptall],[data-reject],[data-delsrc],[data-open],[data-f],[data-addlink],[data-help],[data-edit],[data-wk]');
  if(!t)return;
  const d=t.dataset;
  if(d.mkfam){FAM=newFam();disk.set('fam',FAM);L={};saveLocal();render();return}
  if(d.join){const el=document.getElementById('joinid'),raw=el?el.value:'';const m=raw.match(/[?&]f=([a-z0-9-]+)/i);
    const code=(m?m[1]:raw).trim().replace(/[^a-z0-9-]/gi,'').slice(0,40);if(!code)return;
    FAM=code;disk.set('fam',FAM);L=disk.get('runway:'+FAM)||{};render();pull();return}
  if(d.be){ME=d.be;disk.set('me',ME);render();pull();mirrorSeed();return}
  if(d.addme){const el=document.getElementById('myname'),nm=(el&&el.value||'').trim().slice(0,24);if(!nm){if(el)el.focus();return}
    ME=newMemberId();disk.set('me',ME);write('member:'+ME,{name:nm});mirrorSeed();return}
  if(d.switch){ME=null;disk.set('me',null);render();return}
  if(d.share){try{await navigator.clipboard.writeText(d.share);t.textContent='copied'}catch(err){t.textContent=d.share}setTimeout(render,1400);return}
  if(d.wk){weekOff+=Number(d.wk);render();return}
  if(d.read){readSource(d.read);return}
  if(d.open!==undefined){openSrc=d.open;render();return}
  if(d.edit){const c=child();const labels={name:'Her full name',house:'House — Air, Earth, Fire or Water',klass:'Class',homegroup:'Homegroup'};
    const v=prompt(labels[d.edit]||'Value',c[d.edit]||'');if(v===null)return;
    const next=Object.assign({},get('child',{}));next[d.edit]=v.trim().slice(0,40);write('child',next);return}
  if(d.help!==undefined){openHelp=d.help;render();return}
  if(d.unnix){write('hide:'+d.unnix,{v:false});return}
  if(d.nix){const cf=L['cf:'+d.nix];if(cf)write('cf:'+d.nix,Object.assign({},cf,{deleted:true}));else write('hide:'+d.nix,{v:true});return}
  if(d.addlink){const cur=get('lnk:'+d.addlink,{});const u=prompt('Paste the link for this one',cur.u||'https://');if(u===null)return;
    const clean=u.trim();if(!clean||clean==='https://'){write('lnk:'+d.addlink,{u:'',t:''});return}write('lnk:'+d.addlink,{u:clean,t:'your link'});return}
  if(d.save){const ti=document.getElementById('ntitle'),du=document.getElementById('ndue'),tm=document.getElementById('ntime'),no=document.getElementById('nnote'),bl=document.getElementById('nblock');
    const title=(ti&&ti.value||'').trim().slice(0,80),due=(du&&du.value||'').trim(),time=(tm&&tm.value||'').trim();
    if(!title){if(ti)ti.focus();return}
    write('cf:'+newId('c'),{title:title,due:/^\d{4}-\d{2}-\d{2}$/.test(due)?due:null,time:/^\d{2}:\d{2}$/.test(time)?time:null,note:(no&&no.value||'').trim().slice(0,200)||null,blocking:!!(bl&&bl.checked),src:'added'});
    view='now';render();return}
  if(d.del){write('cf:'+d.del,{deleted:true});return}
  if(d.delsrc){write('src:'+d.delsrc,{deleted:true});return}
  if(d.accept){acceptStaged(d.accept);return}
  if(d.acceptall){stagedFor(d.acceptall).forEach(s=>acceptStaged(s.sid));return}
  if(d.reject){const s=L['st:'+d.reject];if(!s)return;write('st:'+d.reject,Object.assign({},s,{settled:true}));return}
  if(d.f&&!d.view){filter=d.f;render();return}
  if(d.view){view=d.view;flash='';weekOff=0;if(d.f)filter=d.f;render();window.scrollTo(0,0);return}
  if(d.tog){const s=stateOf(d.tog);const next=s.status==='open'?{status:'taken',by:ME}:s.status==='taken'?{status:'done',by:ME}:{status:'open',by:null};write('fact:'+d.tog,next);return}
  if(d.yg){write('yg',{v:d.yg});return}
});

document.addEventListener('visibilitychange',function(){if(!document.hidden){pull();push()}});
window.addEventListener('online',function(){online=true;pull();push()});
window.addEventListener('offline',function(){online=false;paintSync()});

render();
if(FAM&&ME){pull().then(mirrorSeed)}
setInterval(function(){if(!document.hidden)pull()},90000);
</script>
